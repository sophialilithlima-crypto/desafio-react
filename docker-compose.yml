version: "3.9"

services:

  postgres:
    image: postgres:17

    container_name: postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: S0ph14l1l1th
      POSTGRES_DB: desafio-react2

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend

    container_name: backend

    restart: always

    depends_on:
      - postgres

    ports:
      - "8080:8080"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: S0ph14l1l1th
      DB_NAME: desafio-react2

  frontend:
    build: ./frontend

    container_name: frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  postgres_data: